[package]
name = "verisilo-desktop-core-harness"
version = "0.1.0"
description = "Tauri-free compile and test harness for the VeriSilo desktop Rust core"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
url = "2.5.4"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
verisilo-remote-backend = { path = "../verisilo-remote-backend" }
zeroize = "1.8.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }
