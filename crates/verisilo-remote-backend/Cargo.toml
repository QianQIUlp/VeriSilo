[package]
name = "verisilo-remote-backend"
version = "0.9.0"
description = "Pinned self-hosted remote browser environment protocol prototype"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
httparse = "1.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rustls = "0.23.42"
rustls-pemfile = "2.2.0"
rustls-platform-verifier = "0.7.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
thiserror = "2.0.12"
url = "2.5.4"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
x509-parser = "0.18.1"
zeroize = "1.8.1"
