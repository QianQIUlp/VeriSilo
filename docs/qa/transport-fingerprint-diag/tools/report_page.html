<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>VeriSilo transport diagnostic endpoint</title>
</head>
<body>
<h1>Transport diagnostic endpoint reached</h1>
<pre id="report">collecting…</pre>
<script>
const report = {
  userAgent: navigator.userAgent,
  platform: navigator.platform,
  oscpu: navigator.oscpu || null,
  userAgentData: navigator.userAgentData
    ? { brands: navigator.userAgentData.brands, mobile: navigator.userAgentData.mobile, platform: navigator.userAgentData.platform }
    : null,
  language: navigator.language,
  languages: navigator.languages,
  hardwareConcurrency: navigator.hardwareConcurrency,
  deviceMemory: navigator.deviceMemory || null,
  timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
  doNotTrack: navigator.doNotTrack
};
document.getElementById("report").textContent = JSON.stringify(report, null, 1);
fetch("/jsprobe?p=" + encodeURIComponent(JSON.stringify(report)));
</script>
</body>
</html>
