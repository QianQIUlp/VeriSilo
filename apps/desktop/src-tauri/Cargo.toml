[package]
name = "verisilo-desktop"
version = "0.1.0"
description = "Verified browser environment isolation and privacy auditing"
authors = ["VeriSilo contributors"]
edition = "2021"
rust-version = "1.88"
default-run = "verisilo"

[lib]
name = "verisilo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "verisilo"
path = "src/main.rs"

[[bin]]
name = "verisilo-cli"
path = "src/bin/verisilo-cli.rs"

[[bin]]
name = "verisilo-native-host"
path = "src/bin/verisilo-native-host.rs"
required-features = ["native-host"]

[[bin]]
name = "verisilo-acceptance-driver"
path = "acceptance/windows_acceptance_driver.rs"
required-features = ["acceptance-tests"]

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
acceptance-tests = []
native-host = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = { package = "noyalib-serde-yaml", version = "0.0.32" }
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2.0.12"
url = "2.5.4"
uuid = { version = "1.16.0", features = ["serde", "v4"] }
zeroize = "1.8.1"
verisilo-remote-backend = { path = "../../../crates/verisilo-remote-backend" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
