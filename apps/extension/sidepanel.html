<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeriSilo Companion</title>
    <style>
      :root {
        color: #1f2a44;
        font-family: system-ui, sans-serif;
        background: #f7f8fc;
      }
      body {
        margin: 0;
      }
      main {
        padding: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      p {
        color: #5a6480;
        line-height: 1.45;
      }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        margin-top: 8px;
        padding: 10px;
      }
      button.secondary {
        background: #e5e7f5;
        color: #303a58;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }
      #notice {
        border-radius: 8px;
        margin: 12px 0;
        padding: 10px;
      }
      #notice:empty {
        display: none;
      }
      #notice.error {
        background: #fee2e2;
        color: #991b1b;
      }
      #notice.success {
        background: #dcfce7;
        color: #166534;
      }
      .card {
        border: 1px solid #dde2f0;
        border-radius: 10px;
        background: #fff;
        margin-top: 14px;
        padding: 12px;
      }
      .signal {
        border-top: 1px solid #edf0f7;
        padding: 8px 0;
      }
      .signal:first-child {
        border-top: 0;
      }
      .signal small {
        color: #66708b;
        display: block;
        overflow-wrap: anywhere;
      }
      .warning {
        color: #854d0e;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VeriSilo</h1>
      <p>
        查看当前页面可见的浏览器信号。扫描结果仅保存在本机、可信扩展存储中。
      </p>
      <button id="scan" type="button">扫描当前页面</button>
      <button class="secondary" id="privacy" type="button">
        请求隐私控制权限
      </button>
      <button class="secondary" id="webrtc-apply" type="button">
        实验性：减少非代理 WebRTC UDP
      </button>
      <button class="secondary" id="webrtc-restore" type="button">
        恢复 WebRTC 设置
      </button>
      <button class="secondary" id="desktop" type="button">连接桌面端</button>
      <button class="secondary" id="export-json" type="button" disabled>
        导出脱敏 JSON
      </button>
      <button class="secondary" id="export-html" type="button" disabled>
        导出脱敏 HTML
      </button>
      <div id="notice" role="status"></div>
      <section class="card">
        <strong>当前结果</strong>
        <p id="summary">尚未扫描。</p>
        <div id="signals"></div>
      </section>
      <p class="warning">
        “未观察到调用”不等于网站没有收集指纹。MAIN world 注入和 Worker
        覆盖均存在浏览器边界。
      </p>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
