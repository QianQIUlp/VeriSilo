name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  types-tests-and-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm extension:verify
      - run: pnpm native-host:verify
      - run: pnpm engine:verify
      - run: pnpm environment:verify
      - run: pnpm remote-agent:verify
      - run: pnpm release:self-test

  desktop-core-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt
      - run: cargo fetch --locked --manifest-path crates/verisilo-desktop-core-harness/Cargo.toml
      - run: cargo fmt --manifest-path crates/verisilo-desktop-core-harness/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path crates/verisilo-desktop-core-harness/Cargo.toml
      - run: cargo test --locked --manifest-path crates/verisilo-desktop-core-harness/Cargo.toml
      - run: cargo clippy --locked --manifest-path crates/verisilo-desktop-core-harness/Cargo.toml --all-targets -- -D warnings

  remote-backend-and-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
      - run: cargo fmt --manifest-path crates/verisilo-remote-backend/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path crates/verisilo-remote-backend/Cargo.toml
      - run: node scripts/verify-remote-agent-source.mjs
      - run: node scripts/verify-environment-source.mjs
      - run: node tests/windows/environment-backends-static.mjs
      - run: bash -n scripts/verisilo-wsl-guest-agent.sh
      - run: shellcheck scripts/verisilo-wsl-guest-agent.sh

  rust-windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify environment PowerShell sources and self-tests
        shell: pwsh
        run: |
          $parseErrors = @()
          foreach ($file in Get-ChildItem scripts/verisilo-*.ps1 -File) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            $parseErrors += $errors
          }
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          ./scripts/verisilo-environment-probe.ps1 -SelfTest
          ./scripts/verisilo-hyperv.ps1 -SelfTest
          ./scripts/verisilo-sandbox.ps1 -SelfTest
          ./scripts/authenticode-gate.ps1 -SelfTest
