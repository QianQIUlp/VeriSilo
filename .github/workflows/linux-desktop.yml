name: Linux Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      buildManagedEngine:
        description: Build the pinned RC5-patched native Camoufox engine and self-contained Managed desktop (several hours)
        type: boolean
        default: false
      engineBuildArtifactId:
        description: Reuse an unchanged native engine build artifact ID instead of rebuilding Firefox
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  native-linux-desktop:
    if: github.event_name != 'workflow_dispatch' || (!inputs.buildManagedEngine && inputs.engineBuildArtifactId == '')
    # Ubuntu 22.04 is the glibc baseline; newer Linux distributions can run its binaries.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      VERISILO_BUILD_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf openssl xvfb xauth dbus-x11
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          targets: x86_64-unknown-linux-gnu
      - run: pnpm install --frozen-lockfile
      - name: Check desktop UI and Linux build routing
        run: |
          pnpm --filter @verisilo/desktop check
          pnpm --filter @verisilo/desktop test
          node --test scripts/build-linux-desktop.test.mjs
      - name: Verify native package and Host process boundaries
        run: |
          python3 scripts/build-camoufox-host-package.py --self-test
          python3 apps/camoufox-host/test_linux_package.py
      - name: Compile and test the native Linux desktop backend
        run: |
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu
      - name: Build native Debian package
        run: |
          mkdir -p artifacts
          pnpm desktop:package:linux --standard --bundles deb 2>&1 | tee artifacts/linux-desktop-build.log
      - name: Verify installer contents
        run: |
          package=$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" | tee /tmp/verisilo-deb-files.txt
          grep 'usr/bin/verisilo-cli$' /tmp/verisilo-deb-files.txt
          sudo apt-get install -y "$PWD/$package"
      - name: Exercise installed desktop, Vault and real browser lifecycle
        run: |
          xvfb-run -a dbus-run-session -- node scripts/smoke-desktop-linux.mjs --desktop /usr/bin/verisilo --cli /usr/bin/verisilo-cli --browser /usr/bin/google-chrome
          cp artifacts/linux-desktop-smoke/result.json artifacts/linux-desktop-smoke/deb.json
          cp artifacts/linux-desktop-smoke/desktop.log artifacts/linux-desktop-smoke/deb-desktop.log
      - name: Bundle AppImage from the evaluated native build
        run: pnpm desktop:package:linux --standard --bundles appimage --bundle-only 2>&1 | tee artifacts/linux-desktop-appimage-bundle.log
      - name: Exercise AppImage desktop runtime
        run: |
          image=$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$image"
          xvfb-run -a dbus-run-session -- node scripts/smoke-desktop-linux.mjs --desktop "$PWD/$image" --cli /usr/bin/verisilo-cli --browser /usr/bin/google-chrome
          cp artifacts/linux-desktop-smoke/result.json artifacts/linux-desktop-smoke/appimage.json
          cp artifacts/linux-desktop-smoke/desktop.log artifacts/linux-desktop-smoke/appimage-desktop.log
      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verisilo-linux-x64-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            artifacts/linux-desktop-smoke/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve Linux desktop smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verisilo-linux-smoke-${{ github.sha }}
          path: |
            artifacts/linux-desktop-smoke/
            artifacts/linux-desktop-*.log
          if-no-files-found: warn
          retention-days: 14

  native-linux-managed:
    # A native Firefox build is deliberately opt-in; ordinary PRs still compile Linux.
    if: github.event_name == 'workflow_dispatch' && (inputs.buildManagedEngine || inputs.engineBuildArtifactId != '')
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      VERISILO_BUILD_TARGET: x86_64-unknown-linux-gnu
      VERISILO_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select frozen engine build inputs
        env:
          REQUESTED_ENGINE_ARTIFACT_ID: ${{ inputs.engineBuildArtifactId }}
        run: |
          artifact="$REQUESTED_ENGINE_ARTIFACT_ID"
          if [[ -n "$artifact" ]]; then
            [[ "$artifact" =~ ^[1-9][0-9]*$ ]]
          fi
          echo "VERISILO_ENGINE_BUILD_ARTIFACT_ID=$artifact" >> "$GITHUB_ENV"
      - name: Prepare ephemeral native engine build runner
        if: env.VERISILO_ENGINE_BUILD_ARTIFACT_ID == ''
        run: |
          # These are unused preinstalled toolchains on this disposable Actions runner.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/swift
          sudo fallocate -l 24G /verisilo-build.swap
          sudo chmod 600 /verisilo-build.swap
          sudo mkswap /verisilo-build.swap
          sudo swapon /verisilo-build.swap
          df -h .
          free -h
      - name: Install native desktop and engine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils file git curl patch python3-dev libgtk-3-dev libdbus-glib-1-dev libasound2-dev libpulse-dev libx11-xcb-dev libxt-dev libsqlite3-dev nasm yasm unzip zip p7zip-full fontconfig libfontconfig1-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf openssl xvfb xauth dbus-x11 fonts-unfonts-core fonts-unfonts-extra
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.11.0"
          enable-cache: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install committed frontend and Host dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --project apps/camoufox-host --frozen --group build
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Verify native CMS signing and Host crash cleanup
        run: |
          apps/camoufox-host/.venv/bin/python scripts/build-camoufox-host-package.py --self-test
          apps/camoufox-host/.venv/bin/python apps/camoufox-host/test_linux_package.py
          python scripts/check-linux-browser-dependencies.py --self-test
      - name: Build pinned RC5-patched Camoufox natively for Linux
        if: env.VERISILO_ENGINE_BUILD_ARTIFACT_ID == ''
        run: python apps/camoufox-host/build/linux/build.py --work-root "$RUNNER_TEMP/verisilo-engine-work" --out artifacts/linux-engine-build
      - name: Reuse unchanged native engine build
        if: env.VERISILO_ENGINE_BUILD_ARTIFACT_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_ARTIFACT_ID: ${{ env.VERISILO_ENGINE_BUILD_ARTIFACT_ID }}
        run: |
          [[ "$ENGINE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          mkdir -p artifacts/linux-engine-build
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ENGINE_ARTIFACT_ID/zip" > "$RUNNER_TEMP/engine-build-artifact.zip"
          unzip -q "$RUNNER_TEMP/engine-build-artifact.zip" -d artifacts/linux-engine-build
          python apps/camoufox-host/build/linux/build.py --restore-build artifacts/linux-engine-build
      - name: Preserve immutable native engine inputs
        if: env.VERISILO_ENGINE_BUILD_ARTIFACT_ID == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verisilo-linux-engine-build-${{ github.sha }}
          path: |
            artifacts/linux-engine-build/*.zip
            artifacts/linux-engine-build/*.json
            artifacts/linux-engine-build/engine-build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Inspect every frozen browser ELF dependency
        run: python scripts/check-linux-browser-dependencies.py --browser-root artifacts/linux-engine-build/browser --out artifacts/linux-engine-dependencies.json
      - name: Sign native engine package with an ephemeral validation certificate
        run: |
          openssl req -x509 -newkey rsa:3072 -sha256 -nodes -days 365 -subj '/CN=VeriSilo Linux CI Evaluation/' -addext 'extendedKeyUsage=codeSigning' -keyout "$RUNNER_TEMP/linux-engine-key.pem" -out "$RUNNER_TEMP/linux-engine-cert.pem"
          pin=$(openssl x509 -in "$RUNNER_TEMP/linux-engine-cert.pem" -outform DER | sha256sum | cut -d' ' -f1)
          echo "VERISILO_ENGINE_SIGNER_SHA256=$pin" >> "$GITHUB_ENV"
          xvfb-run -a dbus-run-session -- apps/camoufox-host/.venv/bin/python scripts/build-camoufox-host-package.py --out artifacts/linux-engine-package --browser-root artifacts/linux-engine-build/browser --browser-tree-manifest artifacts/linux-engine-build/browser-tree-manifest.json --build-result artifacts/linux-engine-build/linux-build-result.json --linux --sign --pem-certificate "$RUNNER_TEMP/linux-engine-cert.pem" --pem-private-key "$RUNNER_TEMP/linux-engine-key.pem"
      - name: Build self-contained Managed Debian package
        id: managed_deb_build
        run: pnpm desktop:package:linux --engine-package artifacts/linux-engine-package --python apps/camoufox-host/.venv/bin/python --bundles deb 2>&1 | tee artifacts/linux-desktop-build.log
      - name: Install the exact Managed package
        run: |
          package=$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          sudo apt-get install -y "$PWD/$package"
      - name: Exercise packaged Managed Identity and browser lifecycle
        id: managed_deb_smoke
        run: |
          xvfb-run -a dbus-run-session -- node scripts/smoke-desktop-linux.mjs --desktop /usr/bin/verisilo --cli /usr/bin/verisilo-cli --browser /usr/bin/google-chrome --managed
          cp artifacts/linux-desktop-smoke/result.json artifacts/linux-desktop-smoke/deb.json
          cp artifacts/linux-desktop-smoke/desktop.log artifacts/linux-desktop-smoke/deb-desktop.log
      - name: Bundle Managed AppImage without modifying the signed engine tree
        id: managed_appimage_bundle
        if: always() && steps.managed_deb_build.outcome == 'success'
        run: |
          pnpm desktop:package:linux --engine-package artifacts/linux-engine-package --python apps/camoufox-host/.venv/bin/python --bundles appimage --bundle-only 2>&1 | tee artifacts/linux-desktop-appimage-bundle.log
          cp apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/engine-package-check.json artifacts/linux-appimage-engine-verification.json
      - name: Exercise Managed AppImage runtime
        if: steps.managed_deb_smoke.outcome == 'success' && steps.managed_appimage_bundle.outcome == 'success'
        run: |
          image=$(find apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$image"
          xvfb-run -a dbus-run-session -- node scripts/smoke-desktop-linux.mjs --desktop "$PWD/$image" --cli /usr/bin/verisilo-cli --browser /usr/bin/google-chrome --managed
          cp artifacts/linux-desktop-smoke/result.json artifacts/linux-desktop-smoke/appimage.json
          cp artifacts/linux-desktop-smoke/desktop.log artifacts/linux-desktop-smoke/appimage-desktop.log
      - name: Upload evaluated Linux Managed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verisilo-managed-browser-linux-x64-${{ github.sha }}
          path: |
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            artifacts/linux-engine-build/linux-build-result.json
            artifacts/linux-engine-build/runtime-asset-lock.json
            artifacts/linux-engine-dependencies.json
            artifacts/linux-appimage-engine-verification.json
            artifacts/linux-desktop-smoke/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve Linux Managed smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verisilo-linux-managed-smoke-${{ github.sha }}
          path: |
            artifacts/linux-desktop-smoke/
            artifacts/linux-engine-dependencies.json
            artifacts/linux-appimage-engine-verification.json
            artifacts/linux-desktop-*.log
          if-no-files-found: warn
          retention-days: 14
